# Minimal Supabase CLI config. Run `supabase start` from this directory (or set
# `--workdir`) to launch a local Supabase stack, then apply migrations from
# ../migrations. See docs/deployment.md.
project_id = "aion-advisor-growth-engine"

[api]
enabled = true
port = 54321
schemas = ["public", "storage"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 16

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
jwt_expiry = 3600
enable_signup = true

[storage]
enabled = true
